
{% extends "base.html" %}
{% block content %}
<h2>Cart</h2>

<table>
<tr><th>Product</th><th>Qty</th><th>Total</th></tr>
{% for i in items %}
<tr>
<td>{{i.product.name}}</td>
<td>{{i.qty}}</td>
<td>${{i.subtotal}}</td>
</tr>
{% endfor %}
</table>

<h3>Total: ${{total}}</h3>
<a class="btn" href="/checkout">Checkout</a>
{% endblock %}
